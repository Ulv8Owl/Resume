name: Funnel tests

on:
  workflow_dispatch:
    inputs:
      funnel:
        description: 'ID воронки (пусто — все)'
        required: false
  schedule:
    - cron: '17 6 * * *' # каждый день, перед утренним запуском трафика
  push:
    paths: ['funnel-tests/**']

defaults:
  run:
    working-directory: funnel-tests

jobs:
  selftest:
    name: Самопроверка на мок-воронке
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run selftest

  prod:
    name: Прод-воронки
    needs: selftest
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    env:
      FUNNEL: ${{ inputs.funnel }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run discover
      - run: npm test
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: funnel-tests/playwright-report
          retention-days: 14
