<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SocialSensor</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; max-width: 480px; }
  button { display: block; width: 100%; padding: 14px; margin: 8px 0; font-size: 16px; }
  input { width: 100%; padding: 12px; font-size: 16px; box-sizing: border-box; }
</style>
<!--BUG-->
</head>
<body>
<div id="app"></div>
<script>
// Баги для проверки, что тесты их ловят:
//   wrong-price     — на пейволе $59.99 вместо $49.99
//   dup-event       — screen_viewed отправляется дважды
//   ignore-variant  — параметр variant игнорируется, всегда 01_default
//   untagged        — события не помечены рукавом
//   skip-broken     — «Skip» во вводных Virality Predictor ведёт на Fake Followers Checker
//   reoffer-main    — на экране доступа снова предлагают основной продукт
//   meta-percent    — в метадате проценты в сумме 90
//   js-error        — JS-ошибка на экране результатов
const BUG = window.__BUG__ || '';
const EXP = 'EXP-106:tour_vs_classic';
const VARIANTS = [{ name: '01_default', pct: 50 }, { name: '02_tour', pct: BUG === 'meta-percent' ? 40 : 50 }];
const PRODUCTS = ['SocialSensor 7d trial $1 → $49.99/4w', 'Virality Predictor $24.99/month', 'Fake Followers Checker $19.99/year'];
const q = new URLSearchParams(location.search);
const app = document.getElementById('app');

function pickVariant() {
  if (BUG === 'ignore-variant') return '01_default';
  if (q.get('experiment') === EXP && VARIANTS.some(v => v.name === q.get('variant'))) return q.get('variant');
  return Math.random() * 100 < VARIANTS[0].pct ? VARIANTS[0].name : VARIANTS[1].name;
}
const variant = pickVariant();
const distinctId = localStorage.getItem('ph_id') || (localStorage.setItem('ph_id', crypto.randomUUID()), localStorage.getItem('ph_id'));

async function track(event, props = {}) {
  const properties = { ...props, $current_url: location.href, $insert_id: crypto.randomUUID(), distinct_id: distinctId };
  if (BUG !== 'untagged') Object.assign(properties, { experiment: EXP, variant });
  const body = await new Response(
    new Blob([JSON.stringify([{ event, distinct_id: distinctId, properties }])]).stream().pipeThrough(new CompressionStream('gzip'))
  ).blob();
  fetch('/i/v0/e/?compression=gzip-js', { method: 'POST', body, keepalive: true });
}

const PAYWALL = () => `<h1>SocialSensor</h1><p>$1 for 7 days, then ${BUG === 'wrong-price' ? '$59.99' : '$49.99'} every 4 weeks</p>`;

const screens = {};
for (let i = 1; i <= 4; i++) {
  screens[i] = () => variant === '02_tour'
    ? `<h1>Tour ${i}/4: see what SocialSensor can do</h1><button data-go="${i + 1}">Continue</button>`
    : `<h1>Welcome ${i}/4</h1><p>Classic intro screen</p><button data-go="${i + 1}">Continue</button>`;
}
screens[5] = () => `<h1>Enter your profile</h1><input placeholder="@username"><button data-go="6" data-save>Start analysis</button><button data-go="8">Skip</button>`;
screens[6] = () => { setTimeout(() => go(7), 8000); return `<h1>Analyzing ${sessionStorage.getItem('username') || ''}…</h1>`; };
screens[7] = () => { if (BUG === 'js-error') setTimeout(() => undefinedFn(), 0); return `<h1>Preliminary results</h1><button data-go="8">Get full analysis</button>`; };
screens[8] = () => { loadSolidgate(); return PAYWALL() + `<button>Pay with card</button><button data-go="9">Apple Pay</button>`; };
screens[9] = () => `<h1>Wait! Your offer is still here</h1><p>$1 for 7 days, then $49.99 every 4 weeks</p><button>Pay</button>`;
for (let i = 0; i < 3; i++) {
  screens[10 + i] = () => `<h1>Virality Predictor ${i + 1}/3</h1><button data-go="${11 + i}">Continue</button><button data-go="${BUG === 'skip-broken' ? 17 : 13}">Skip</button>`;
  screens[14 + i] = () => `<h1>Fake Followers Checker ${i + 1}/3</h1><button data-go="${15 + i}">Continue</button><button data-go="17">Skip</button>`;
}
screens[13] = () => `<h1>Virality Predictor</h1><p>$24.99/month</p><button>Buy</button><button data-go="14">No, thanks</button>`;
screens[17] = () => `<h1>Fake Followers Checker</h1><p>$19.99/year</p><button>Buy</button><button data-go="18">No, thanks</button>`;
screens[18] = () => `<h1>Your access is ready</h1><button>Open SocialSensor</button>` + (BUG === 'reoffer-main' ? `<p>Get SocialSensor for $49.99</p>` : '');

function loadSolidgate() {
  const s = document.createElement('script');
  s.src = '/mock-solidgate/form.js';
  document.head.appendChild(s);
}

function go(step) {
  if (!screens[step]) step = 1;
  app.innerHTML = screens[step]();
  track('$pageview');
  track('screen_viewed', { step });
  if (BUG === 'dup-event') track('screen_viewed', { step });
}

app.addEventListener('click', (e) => {
  const b = e.target.closest('[data-go]');
  if (!b) return;
  if (b.hasAttribute('data-save')) sessionStorage.setItem('username', app.querySelector('input').value);
  go(Number(b.dataset.go));
});

if (q.has('metadata')) {
  app.innerHTML = `<h1>Funnel metadata: claude-tour</h1>
    <h2>Experiment: ${EXP}</h2>
    ${VARIANTS.map(v => `<div>${v.name} — ${v.pct}% <a href="?experiment=${encodeURIComponent(EXP)}&variant=${v.name}">open</a></div>`).join('')}
    <h2>Products</h2><ul>${PRODUCTS.map(p => `<li>${p}</li>`).join('')}</ul>`;
} else {
  go(Number(q.get('step')) || 1);
}
</script>
</body>
</html>
